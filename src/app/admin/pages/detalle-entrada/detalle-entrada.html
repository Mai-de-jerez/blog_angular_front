<app-toast-local></app-toast-local>
@if (cargando()) {
  <p>Cargando entrada...</p>
} @else if (entrada()) {
  <p class="entrada-id"><strong>ID:</strong> {{ entrada()!.id }}</p>
  <app-detalle-entrada-card
    [entrada]="entrada()!"
    [puedeGestionar]="true"
    (volver)="irAtras()"
    (editar)="irAEditar()"
    (eliminar)="borrar()">
  </app-detalle-entrada-card>
}
