<!-- solicitar-password.html -->
 <div class="auth-card">
<app-toast-local></app-toast-local>
  <h2 class="login-title">Recuperar Contraseña</h2>
  <form (ngSubmit)="onSolicitar()" #resetForm="ngForm">
    <div class="form-group">
      <label>Introduce tu email</label>
      <input 
        type="email" 
        name="email" 
        [(ngModel)]="email" 
        required 
        placeholder="ejemplo@correo.com">
    </div>

    <div class="helper-links">
      <span>Se enviará un código a tu bandeja de entrada.</span>
    </div>

    <button type="submit" class="btn-login" [disabled]="!resetForm.valid">
      Enviar Enlace
    </button>

    <div class="back-container">
      <a routerLink="/login" class="btn-back">← Volver al login</a>
    </div>
  </form>
 </div>
