<app-toast-local></app-toast-local>
  <h2 class="login-title">Nueva Contraseña</h2>
  <form (ngSubmit)="onCambiar()" #cambiarForm="ngForm">
    <div class="form-group">
      <label>Nueva contraseña</label>
      <input 
        type="password" 
        name="pass1" 
        [(ngModel)]="pass1" 
        required 
        placeholder="Introduce tu nueva contraseña">
    </div>

    <div class="form-group">
      <label>Repite la contraseña</label>
      <input 
        type="password" 
        name="pass2" 
        [(ngModel)]="pass2" 
        required 
        placeholder="Repite tu nueva contraseña">
    </div>

    <button type="submit" class="btn-login" [disabled]="!cambiarForm.valid">
      Cambiar Contraseña
    </button>

    <div class="back-container">
      <a routerLink="/login" class="btn-back">← Volver al login</a>
    </div>
  </form>
