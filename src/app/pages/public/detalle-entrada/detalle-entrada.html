@if (cargando) {
  <p>Cargando...</p>
} @else if (error) {
  <p>{{ error }}</p>
} @else if (entrada) {
  <article>
    <h1>{{ entrada.titulo }}</h1>
    <p>{{ entrada.nombreAutor }} — {{ entrada.fechaCreacion | date:'dd/MM/yyyy' }}</p>
    <p>{{ entrada.nombreCategoria }}</p>
    <div>{{ entrada.contenido }}</div>
  </article>
}
