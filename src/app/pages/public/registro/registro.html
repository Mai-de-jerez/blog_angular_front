<div class="auth-card">
  
  <h2 class="register-title">Crear cuenta</h2>

  <form (ngSubmit)="onRegistro()" #registroForm="ngForm">
  <div class="form-row">
    <div class="form-group">
      <label>Usuario</label>
      <input
        type="text"
        name="username"
        [(ngModel)]="datos.username"
        required
        placeholder="nombreusuario">
    </div>

    
      <div class="form-group">
        <label>Nombre</label>
        <input
          type="text"
          name="nombre"
          [(ngModel)]="datos.nombre"
          required
          placeholder="Ana">
      </div>
    </div>
      <div class="form-group">
        <label>Apellidos</label>
        <input
          type="text"
          name="apellidos"
          [(ngModel)]="datos.apellidos"
          required
          placeholder="García López">
      </div> 
  
    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        name="email"
        [(ngModel)]="datos.email"
        required
        placeholder="ana@correo.com">
    </div>

    <div class="form-row">
      <div class="form-group">
      <label>Contraseña</label>
      <input
        type="password"
        name="pass1"
        [(ngModel)]="datos.pass1"
        required
        placeholder="••••••••"
        autocomplete="new-password">
      </div>

      <div class="form-group">
        <label>Confirmar contraseña</label>
        <input
          type="password"
          name="pass2"
          [(ngModel)]="datos.pass2"
          required
          placeholder="••••••••"
          autocomplete="new-password">
      </div>
    </div>
    

    <div class="form-group">
      <label>Teléfono</label>
      <input
        type="tel"
        name="telefono"
        [(ngModel)]="datos.telefono"
        placeholder="600123456">
    </div>

    <div class="form-group">
      <label>Dirección</label>
      <input
        type="text"
        name="direccion"
        [(ngModel)]="datos.direccion"
        placeholder="Calle Mayor, 1">
    </div>

    <div class="form-group">
      <label>Foto</label>
      <input type="file" 
      name="foto" 
      accept=".jpg,.jpeg,.png,.webp" 
      (change)="onFotoSeleccionada($event)">
    </div>

    <app-toast-local></app-toast-local>
    <button type="submit" class="btn-register" [disabled]="!registroForm.valid || cargando">
      {{ cargando ? 'Registrando...' : 'Registrarse' }}
    </button>

    <div class="helper-links">
      <span>¿Ya tienes cuenta? </span>
      <a routerLink="/login">Inicia sesión aquí</a>
    </div>

    <div class="back-container">
      <a routerLink="/" class="btn-back">← Volver al blog</a>
    </div>

  </form>
</div>
