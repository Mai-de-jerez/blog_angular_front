<div class="detalle-container">
  <app-toast-local></app-toast-local>
  @if (cargando()) {
    <div class="spinner">Cargando la entrada...</div>
  } @else if (entrada(); as entrada) {
    <app-detalle-entrada-card
      [entrada]="entrada"
      [puedeGestionar]="puedeGestionar"
      (volver)="irAtras()"
      (editar)="irAEditar()"
      (eliminar)="borrar()">
    </app-detalle-entrada-card>
    <app-comentarios [entradaId]="entrada.id!"></app-comentarios>
  }
</div>
