<form (ngSubmit)="onSubmit()" #f="ngForm" class="form-container">
  <h2 class="form-title">Editar Entrada</h2>

  <div class="grid-form">
    <!-- Título -->
    <div class="form-group full-width">
      <label>Título de la entrada</label>
      <input type="text" [(ngModel)]="entrada.titulo" name="titulo" required placeholder="Ej: Las claves de la gnosis">
    </div>

    <!-- Categoría -->
    <div class="form-group">
      <label>Categoría</label>
      <ng-select
          [items]="categoriasParaSelect()"
          bindLabel="label"
          bindValue="data"
          groupBy="groupLabel"
          [(ngModel)]="entrada.categoriaId"
          name="categoriaId"
          placeholder="Selecciona una categoría...">
      </ng-select>     
    </div>

    <!-- Imagen -->
    <div class="form-group">
      <label>Imagen de la entrada</label>
        <input 
          type="file" 
          (change)="onFileSelected($event)" 
          name="imagen" 
          accept="image/*"
          class="file-input"
        >
    </div>

    <!-- Contenido -->
    <div class="form-group full-width">
      <label>Contenido del post</label>
      <textarea [(ngModel)]="entrada.contenido" name="contenido" required rows="12" placeholder="Escribe aquí..."></textarea>
    </div>
  </div>

  <!-- Botones de acción -->
  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="onCancel()">Cancelar</button>
    <button type="submit" class="btn-primary" [disabled]="!f.valid">Guardar Entrada</button>
  </div>
</form>
