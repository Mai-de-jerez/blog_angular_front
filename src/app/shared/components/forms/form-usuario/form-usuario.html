<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-container">
  <h2 class="form-title">{{ titulo() }}</h2>  
  <div class="grid-form">
    <div class="form-group">
      <label>Username</label>
      <input type="text" formControlName="username" placeholder="username">
      <app-field-error [control]="form.get('username')" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="email@ejemplo.com">
      <app-field-error [control]="form.get('email')" />
    </div>

    <div class="form-group">
      <label>Nombre</label>
      <input type="text" formControlName="nombre" placeholder="Nombre">
      <app-field-error [control]="form.get('nombre')" />
    </div>

    <div class="form-group">
      <label>Apellidos</label>
      <input type="text" formControlName="apellidos" placeholder="Apellidos">
      <app-field-error [control]="form.get('apellidos')" />
    </div>

    <div class="form-group">
      <label>Teléfono</label>
      <input type="text" formControlName="telefono" placeholder="654321098">
      <app-field-error [control]="form.get('telefono')" [mensajes]="{ pattern: 'El teléfono debe tener entre 9 y 15 dígitos' }" />
    </div>

    <div class="form-group">
      <label>Dirección</label>
      <input type="text" formControlName="direccion" placeholder="Calle...">
      <app-field-error [control]="form.get('direccion')" [mensajes]="{ pattern: 'Solo se permiten letras, números y , . -' }" />
    </div>

    @if (puedeEditarRol) {
      <div class="form-group">
        <label>Rol</label>
        <select formControlName="rol">
          <option value="USUARIO">USUARIO</option>
          <option value="ADMIN">ADMIN</option>
          <option value="SUPERADMIN">SUPERADMIN</option>
        </select>
      </div>
    }

    <div class="form-group">
      <label>{{ idUsuarioEditando() ? 'Nueva contraseña (opcional)' : 'Contraseña' }}</label>
      <input type="password" formControlName="pass1" placeholder="Dejar vacío para no cambiar" autocomplete="new-password">
      <app-field-error [control]="form.get('pass1')" [mensajes]="{ pattern: 'Debe tener al menos una mayúscula y un número' }" />
    </div>

    <div class="form-group">
      <label>Repetir contraseña</label>
      <input type="password" formControlName="pass2" placeholder="Repetir contraseña" autocomplete="new-password">
      <app-field-error [control]="form.get('pass2')" />
    </div>

    <div class="form-group">
      <label>Foto</label>
      <input type="file" (change)="onFileSelected($event)" accept="image/*" class="file-input">
    </div>

  </div><br>

      <app-toast-local></app-toast-local>

  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="onCancel()">Cancelar</button>
    <button type="submit" class="btn-primary" [disabled]="cargando()">
      {{ cargando() ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</form>
