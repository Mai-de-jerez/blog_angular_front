<nav class="navbar">
  <a routerLink="/" class="navbar-brand">MAI-BLOG</a>

  <button class="hamburger" (click)="toggleMenu()" [class.abierto]="menuAbierto" aria-label="Menú">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <ul class="navbar-nav" [class.abierto]="menuAbierto">
    <li class="nav-item">
      <a routerLink="/entradas" routerLinkActive="active-link" class="nav-link" (click)="cerrarMenu()">Entradas</a>
    </li>
    <li class="nav-item">
      <a routerLink="/sobre-mi" routerLinkActive="active-link" class="nav-link" (click)="cerrarMenu()">Sobre mí</a>
    </li>
    @if (!authService.isLogged()) {
      <li class="nav-item login-item">
        <a routerLink="/login" routerLinkActive="active-link" class="nav-link" (click)="cerrarMenu()">Login</a>
      </li>
    } @else {
      <li class="nav-item login-item user-group">
        @if (authService.isAdmin()) {
          <a routerLink="/admin" routerLinkActive="active-link" class="nav-link" (click)="cerrarMenu()">Admin</a>
        }
        <a routerLink="/mi-perfil" routerLinkActive="active-link" class="nav-link" (click)="cerrarMenu()">Mi Perfil</a>
        <a (click)="onLogout(); cerrarMenu()" class="nav-link" style="cursor: pointer;">Logout</a>
      </li>
    }
  </ul>
</nav>
