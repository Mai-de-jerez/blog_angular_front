<nav class="navbar">
  <a routerLink="/" class="navbar-brand">MAI-BLOG</a>
  <ul class="navbar-nav">
    <li class="nav-item">
      <a routerLink="/entradas" routerLinkActive="active-link" class="nav-link">Entradas</a>
    </li>
    <li class="nav-item">
      <a routerLink="/sobre-mi" routerLinkActive="active-link" class="nav-link">Sobre mí</a>
    </li> 
    @if (!authService.isLogged()) {
      <li class="nav-item login-item">
        <a routerLink="/login" routerLinkActive="active-link" class="nav-link">Login</a>
      </li> 
    } @else {
      <li class="nav-item login-item user-group">
        @if (authService.isAdmin()) {
          <a routerLink="/admin" routerLinkActive="active-link" class="nav-link">Admin</a>
        }
        <a routerLink="/mi-perfil" routerLinkActive="active-link" class="nav-link">Mi Perfil</a>
        <a (click)="onLogout()" class="nav-link" style="cursor: pointer;">Logout</a>
      </li>
    }
  </ul>
</nav>
