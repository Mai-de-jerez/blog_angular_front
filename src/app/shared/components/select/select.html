<label>
  {{ label }}
  <select
    [disabled]="disabled"
    (change)="onSelect($event)"
    (blur)="onTouched()"
  >
    <option value="">-- Selecciona --</option>
    <option *ngFor="let op of opciones" [value]="op.valor" [selected]="op.valor == value">
      {{ op.etiqueta }}
    </option>
  </select>
</label>
